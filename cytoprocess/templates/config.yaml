# CytoProcess configuration file
# ------------------------------

# Configure link to EcoTaxa
ecotaxa:
  # Base URL of the EcoTaxa instance used
  url: https://ecotaxa.obs-vlfr.fr
  # Numeric ID of the EcoTaxa project to which data will be uploaded
  # (you can find this in the project list or in the URL of the project page)
  project_id: null
  # Time to wait for an upload to finish before considering it failed
  # (increase if you have a slow connection)
  upload_timeout_seconds: 300 


# This part maps instrument metadata fields from the .json files to
# column names for import into EcoTaxa.
#
# Metadata in EcoTaxa is organised in three levels:
#    sample, acq (acquisition), and process
#
# Run `cytoprocess extract_meta --list <project>` to list all available fields.
#
# Edit the sections below to customize which fields are extracted,
# at which EcoTaxa level they are associated, and how they will be named.
# EcoTaxa names are lowercased upon import, so use names like 'my_variable'
# instead of 'myVariable', which would be turned into the less readable 'myvariable'.
sample:  # maximum of 60 fields
  channels[].description: channels_description
  laserBeamWidth: laser_beam_width
  measurementResults.PMTtemperature: pmt_temperature
  measurementResults.duration: duration
  measurementResults.laserTemperature: laser_temperature
  measurementResults.pressureAbsolute: pressure_absolute
  measurementResults.pumpedVolume: pumped_volume
  measurementResults.sheathTemperature: sheath_temperature
  measurementResults.start: start_date_time
  measurementResults.systemTemperature: system_temperature
  measurementSettings.CytoSettings.CytoSettings.CytoUSBSettings.CytoUSBVersion: cyto_usb_version
  measurementSettings.CytoSettings.CytoSettings.DCSamplePump.CalibrationDate: calibration_date
  measurementSettings.CytoSettings.CytoSettings.ImagePixelSize: image_pixel_size
  measurementSettings.CytoSettings.CytoSettings.LaserInfo[].ConfiguredPower: laser_configured_power
  measurementSettings.CytoSettings.CytoSettings.LaserInfo[].Wavelength: laser_wavelength
  measurementSettings.CytoSettings.CytoSettings.OpticalMagnification: optical_magnification
  measurementSettings.CytoSettings.CytoSettings.SubLoopVolume_uL: sub_loop_volume_ul
  measurementSettings.CytoSettings.CytoSettings.hasExternalPinchValve: has_external_pinch_valve
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.CameraName: camera_name
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.Description: camera_description
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.FirmwareVersion: camera_firmware_version
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.FpgaVersion: camera_fpga_version
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.LensDescription: camera_lens_description
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.ModelName: camera_model_name
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.SerialNumber: camera_serial_number
  measurementSettings.CytoSettings.CytoSettings.iif.Camera.VendorName: camera_vendor_name
  measurementSettings.CytoSettings.CytoSettings.iif.opticalMagnification: optical_magnification
  measurementSettings.CytoSettings.SamplePompSpeed: sample_pomp_speed
  measurementSettings.CytoSettings.SeperateConcentration: seperate_concentration
  measurementSettings.CytoSettings.SmartTriggerSettingDescription: smart_trigger_setting_description
  measurementSettings.CytoSettings.SmartTriggerSettings[].ChannelName: smart_trigger_channel_name
  measurementSettings.CytoSettings.SmartTriggerSettings[].Maximum: smart_trigger_maximum
  measurementSettings.CytoSettings.SmartTriggerSettings[].Minimum: smart_trigger_minimum
  measurementSettings.CytoSettings.SmartTriggeringEnabled: smart_triggering_enabled
  measurementSettings.CytoSettings.TabName: tab_name
  measurementSettings.CytoSettings.UserRemarks: user_remarks
  measurementSettings.CytoSettings.PMTLevelPreset: pmt_level_preset
  measurementSettings.CytoSettings.PMTlevels_str: pmt_levels
  name: instrument_name
  serialNumber: instrument_serial_number

acq:  # maximum of 27 fields
  measurementSettings.CytoSettings.CytoSettings.ExternalTriggerFeedbackLed: external_trigger_feedback_led
  measurementSettings.CytoSettings.CytoSettings.ExternalTriggerIsPulse: external_trigger_is_pulse
  measurementSettings.CytoSettings.CytoSettings.HasExternalTrigger: has_external_trigger
  measurementSettings.CytoSettings.CytoSettings.iif.CameraDelay: camera_delay
  measurementSettings.CytoSettings.CytoSettings.iif.CameraDelayOffset_us: camera_delay_offset_us
  measurementSettings.CytoSettings.CytoSettings.iif.ExposureTime: exposure_time
  measurementSettings.CytoSettings.CytoSettings.iif.FlashDurationCount: flash_duration_count
  measurementSettings.CytoSettings.CytoSettings.iif.framerate: framerate
  measurementSettings.CytoSettings.IIFPhotographLargeParticles: iif_photograph_large_particles
  measurementSettings.CytoSettings.IIFRestrictFwsRange: iif_restrict_fws_range
  measurementSettings.CytoSettings.IIFRoiName: iif_roi_name
  measurementSettings.CytoSettings.IIFSetDefintionFileName: iif_set_defintion_file_name
  measurementSettings.CytoSettings.IIFSetSelectionInfo[].NumberOfImages: number_of_images_in_set
  measurementSettings.CytoSettings.IIFSetSelectionInfo[].WantImages: want_images_in_set
  measurementSettings.CytoSettings.IIFUseSetDefintionSelector: iif_use_set_defintion_selector
  measurementSettings.CytoSettings.IIFuseSmartGrid: iif_use_smart_grid
  measurementSettings.CytoSettings.IIFuseTargetAll: iif_use_target_all
  measurementSettings.CytoSettings.IIFuseTargetRange: iif_use_target_range
  measurementSettings.CytoSettings.LimitParticleRate: limit_particle_rate
  measurementSettings.CytoSettings.MaxAnalysedVolume: max_analysed_volume
  measurementSettings.CytoSettings.MaxNumberFotoText: max_number_foto_text
  measurementSettings.CytoSettings.MaxNumberParticleText: max_number_particle_text
  measurementSettings.CytoSettings.MaxParticleRate: max_particle_rate
  measurementSettings.CytoSettings.MaxPumpedVolume: max_pumped_volume
  measurementSettings.CytoSettings.TriggerChannel: trigger_channel
  measurementSettings.CytoSettings.TriggerLevel1e: trigger_level1e

process:  # maximum of 30 fields
  measurementSettings.CytoSettings.CalibrateCamera: calibrate_camera
  measurementSettings.CytoSettings.CytoSettings.CameraPixelSize: camera_pixel_size
  measurementSettings.CytoSettings.CytoSettings.EnableCompressIIFImages: enable_compress_iif_images
  measurementSettings.CytoSettings.CytoSettings.EnableSaveUnmatchedIIFFoto: enable_save_unmatched_iif_foto
  measurementSettings.CytoSettings.CytoSettings.iif.AllwaysTakeLargerParticlePictures: allways_take_larger_particle_pictures
  measurementSettings.CytoSettings.CytoSettings.iif.BigParticleThreshold: big_particle_threshold
  measurementSettings.CytoSettings.CytoSettings.iif.Brightness: brightness
  measurementSettings.CytoSettings.CytoSettings.iif.Gain: gain
  measurementSettings.CytoSettings.CytoSettings.iif.HorizontalFlip: horizontal_flip
  measurementSettings.CytoSettings.CytoSettings.iif.ImageScaleMuPerPixelP: image_scale_mu_per_pixel_p
  measurementSettings.CytoSettings.CytoSettings.iif.VerticalFlip: vertical_flip
  measurementSettings.CytoSettings.CytoSettings.iif.dBGain: db_gain
  measurementSettings.CytoSettings.CytoSettings.triggerlevelConstant: triggerlevel_constant
  measurementSettings.CytoSettings.CytoSettings.triggerlevelOffset: triggerlevel_offset
  measurementSettings.CytoSettings.IIFFwsRatioMax: iif_fws_ratio_max
  measurementSettings.CytoSettings.IIFFwsRatioMin: iif_fws_ratio_min
  measurementSettings.CytoSettings.MeasureNoiseLevels: measure_noise_levels
  measurementSettings.CytoSettings.StopAfterTime: stop_after_time
  measurementSettings.CytoSettings.StopAtAnalysedVolume: stop_at_analysed_volume
  measurementSettings.CytoSettings.StopAtAnalysedVolumeString: stop_at_analysed_volume
  measurementSettings.CytoSettings.StopAtFotos: stop_at_fotos
  measurementSettings.CytoSettings.StopAtFotosString: stop_at_fotos
  measurementSettings.CytoSettings.StopAtParticles: stop_at_particles
  measurementSettings.CytoSettings.StopAtParticlesString: stop_at_particles
  measurementSettings.CytoSettings.StopAtPumpedVolume: stop_at_pumped_volume
  measurementSettings.CytoSettings.StopAtPumpedVolumeString: stop_at_pumped_volume
  measurementSettings.CytoSettings.StopafterTimertext: stop_after_timer


# This part maps cytometric features from particles in the .json files to
# column names for import into EcoTaxa.
#
# Object-level features are extracted from each particle's "parameters" list.
# Paths are in the format "description.key" where description identifies
# the parameter (e.g., "FWS", "Sidewards Scatter", "Fl Red") and key is the
# specific measurement (e.g., "length", "total", "maximum").
#
# Run `cytoprocess extract_cyto --list <project>` to list all available features.
#
# Edit the section below to customize which features are extracted and how they are named.
# Only the features actually present in the file will be extracted, so you can list more
# features than you expect to be present and only the available ones will be imported.
object:
  Curvature.asymmetry: curvature_asymmetry
  Curvature.average: curvature_average
  Curvature.centreOfGravity: curvature_centre_of_gravity
  Curvature.fillFactor: curvature_fill_factor
  Curvature.first: curvature_first
  Curvature.inertia: curvature_inertia
  Curvature.last: curvature_last
  Curvature.length: curvature_length
  Curvature.maximum: curvature_max
  Curvature.minimum: curvature_min
  Curvature.numberOfCells: curvature_number_of_cells
  Curvature.sampleLength: curvature_sample_length
  Curvature.swscov: curvature_swscov
  Curvature.total: curvature_total
  Curvature.variableLength: curvature_variable_length
